- type: entity
  parent: [BaseItemHarmless, RecyclableItemPaper]
  id: RatvarBase
  abstract: true
  components:
    - type: Sprite
      scale: 0.6, 0.6
      sprite: _HL/Objects/Fun/ratvar.rsi
      layers:
      - state: paper_stamp-generic
        map: ["enum.PaperVisualLayers.Stamp"]
        visible: false
    - type: Item
      size: Small
      heldPrefix: ratvar
    - type: Tag
      tags:
      - RatvarCard
    - type: ItemToggle
      onAltUse: true
      predictable: false
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleVisuals.Toggled:
         red:
            True: { visible: true }
            False: { visible: false }
         blue:
            True: { visible: false }
            False: { visible: true }
    - type: Paper
      destroyOnFax: true
    - type: PaperVisuals
      backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
      contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
      backgroundModulate: "#cccccc"
      contentImageModulate: "#cccccc"
      backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
      contentMargin: 16.0, 16.0, 16.0, 16.0
    - type: ActivatableUI
      key: enum.PaperUiKey.Key
      requiresComplex: false
    - type: UserInterface
      interfaces:
        enum.PaperUiKey.Key:
          type: PaperBoundUserInterface

