- type: entity
  parent: BaseItemHarmless
  id: RatvarBase
  abstract: true
  components:
    - type: Sprite
      scale: 0.6, 0.6
      sprite: _HL/Objects/Fun/ratvar.rsi
    - type: Item
      size: Small
      heldPrefix: ratvar
    - type: Tag
      tags:
      - RatvarCard
    - type: ItemToggle
      onAltUse: true
      predictable: false
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleVisuals.Toggled:
         red:
            True: { visible: true }
            False: { visible: false }
         blue:
            True: { visible: false }
            False: { visible: true }

