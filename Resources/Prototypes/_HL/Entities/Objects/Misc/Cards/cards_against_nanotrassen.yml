# Black cards
- type: entity
  parent: BasePlayingCardDeckBox
  id: CardsAgainstNanotrassenCardDeckBox
  name: box of cards
  description: A small carton containing a set of cards.
  suffix: CardsAgainstNanotrassen
  components:
  - type: Sprite
    sprite: _HL/Objects/Misc/Cards/card_against_nanotrassen.rsi
  - type: ContainerFill
    containers:
      storagebase:
      - CardsAgainstNanotrassenCardDeck

- type: entity
  parent: BasePlayingCardDeck
  id: CardsAgainstNanotrassenCardDeck
  name: deck of cards against nanotrassen
  suffix: CardsAgainstNanotrassen
  components:
  - type: PlayingCardDeck
    prototype: StandardCardsAgainstNanotrassenCards

