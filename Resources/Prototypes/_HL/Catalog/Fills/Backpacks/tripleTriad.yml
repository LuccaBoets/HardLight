# BASE
- type: entity
  parent: BaseItem
  id: BaseBoosterPack
  name: Booster Pack
  description: Booster boxes? Here?
  abstract: true
#  categories: [ HideSpawnMenu ]
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: _HL/Objects/Fun/triple_triad.rsi
    state: boosters_pack
  - type: Item
    size: Normal

## Starter Pack
- type: entity
  parent: BaseBoosterPack
  id: StarterPack
  name: Starter Pack
  components:
  - type: StaticPrice
    price: 200
  - type: SpawnItemsOnUse
    items:
      - id: TripleTriad3123
      - id: TripleTriad3222
      - id: TripleTriad1414
      - id: TripleTriad2561
      - id: TripleTriad5545
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg


