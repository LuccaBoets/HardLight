# BASE
- type: entity
  parent: BaseItem
  id: BaseBoosterPack
  name: Booster Pack
  description: Booster boxes? Here?
  abstract: true
#  categories: [ HideSpawnMenu ]
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: _HL/Objects/Fun/ratvar.rsi
    state: boosters_pack
  - type: Item
    size: Normal

## Starter Pack
- type: entity
  parent: BaseBoosterPack
  id: StarterPack
  name: Starter Pack
  components:
  - type: StaticPrice
    price: 200
  - type: SpawnItemsOnUse
    items:
      - id: Ratvar3123
      - id: Ratvar3222
      - id: Ratvar1414
      - id: Ratvar2561
      - id: Ratvar5545
      - id: PaperRatvarRules
      - id: RatvarBag
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg

- type: entity
  name: ratvar rules
  parent: Paper
  id: PaperRatvarRules # legally gray zone of using "D&D" and "DND"
  description: 'All the rules you need to play Ratvar'
  components:
  - type: Paper
    contentSize: 10000
    content: ratvar-rules
  - type: Sprite
    layers:
      - state: paper
        color: "#cccccc"
      - state: paper_words
        map: ["enum.PaperVisualLayers.Writing"]
        color: "#cccccc"
        visible: false
      - state: paper_stamp-generic
        map: ["enum.PaperVisualLayers.Stamp"]
        visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundModulate: "#cccccc"
    contentImageModulate: "#cccccc"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0

